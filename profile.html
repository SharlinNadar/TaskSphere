<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile</title>
  <link rel="stylesheet" href="profile.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <header>
    <div class="logo">TaskSphere</div>
    <nav>
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="tasks.html">Tasks</a></li>
        <li><a href="profile.html" class="active">Profile</a></li>
        <li><a href="team.html">Team</a></li>
      </ul>
    </nav>
  </header>

  <div class="profile-container">
    <div class="profile-card">
      <h2 class="username" id="username">Loading...</h2>
      <p class="user-role" id="user-role"></p>
      <p class="user-email" id="user-email"></p>
      <button class="edit-profile-btn" id="edit-profile-btn">Edit Profile</button>
    </div>

    <form class="edit-profile-form" id="edit-profile-form" style="display: none;">
      <input type="text" id="edit-name" placeholder="Full Name" required>
      <input type="text" id="edit-role" placeholder="Role" required>
      <input type="email" id="edit-email" disabled>
      <button type="submit">Save Changes</button>
    </form>
  </div>

  <footer>
    <p>&copy; 2025 Task Manager. All rights reserved.</p>
  </footer>

  <!-- Firebase + Script -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js"></script>
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="profile.js"></script>
</body>
</html>
