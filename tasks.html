<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management</title>
    <link rel="stylesheet" href="tasks.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo">TaskSphere</div>
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
            </ul>
        </nav>
    </header>

    <div class="content">
        <h1>My Tasks</h1>
        <button id="create-task-btn">Create Task</button>
        <ul id="task-list"></ul>
    </div>

    <!-- Modal for creating/editing task -->
    <div id="create-task-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modal-title"></h2>
            <form id="create-task-form">
                <input type="hidden" id="task-id">
                <input type="text" id="task-title" placeholder="Task Title" required>
                <textarea id="task-desc" placeholder="Task Description" required></textarea>
                <select id="task-status">
                    <option value="pending">Pending</option>
                    <option value="in-progress">In Progress</option>
                    <option value="completed">Completed</option>
                </select>
                <button type="submit" id="submit-btn">Create Task</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Task Manager</p>
    </footer>

    <!-- Status Modal for Task Update/Delete -->
    <div id="status-modal" class="status-modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <p id="status-message"></p>
        </div>
    </div>

    <!-- Firebase SDK scripts (no type="module" required here) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js"></script>

    <!-- Your custom JS files with type="module" -->
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="task.js"></script>

</body>
</html>
